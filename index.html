<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photon — Decentralized P2P Social Network</title>
  <meta name="description" content="Decentralized P2P social platform — Twitter + Facebook + TikTok, fully peer-to-peer." />
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
  <!-- ===== LOGIN / SETUP SCREEN (shown first, hidden after auth) ===== -->
  <div id="setup-layout">
    <div id="setup-container">
      <div style="text-align:center;color:var(--text-dim);">Loading Photon...</div>
    </div>
  </div>

  <!-- URL-based reset handler (runs before module scripts) -->
  <script>
    if (location.search.includes('reset')) {
      (async function() {
        localStorage.clear();
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if (navigator.serviceWorker) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        location.href = location.pathname;
      })();
    }
  </script>

  <!-- ===== MAIN APP SHELL (hidden until authenticated) ===== -->
  <div id="app-layout" style="display:none;">
    <aside>
      <div class="logo">⚡ Photon</div>
      <nav>
        <div class="nav-item active" data-view="feed">
          <span>🏠</span> Home
        </div>
        <div class="nav-item" data-view="explore">
          <span>🔍</span> Explore
        </div>
        <div class="nav-item" data-view="videos">
          <span>🎬</span> Videos
        </div>
        <div class="nav-item" data-view="rooms">
          <span>💬</span> Rooms
        </div>
        <div class="nav-item" data-view="profile">
          <span>👤</span> Profile
        </div>
        <div class="nav-item" data-view="peers">
          <span>🌐</span> Network
        </div>
        <div class="nav-item" data-view="files">
          <span>📦</span> Files
        </div>
        <div class="nav-item" data-view="transfers">
          <span>📥</span> Transfers
        </div>
        <div class="nav-item" data-view="settings">
          <span>⚙️</span> Settings
        </div>
      </nav>
      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);">
        <div id="peer-count" style="font-size: 0.75rem; color: var(--text-dim);">0 peers online</div>
      </div>
    </aside>

    <main>
      <header>
        <h2 id="view-title">Home</h2>
        <div id="user-pill" style="display:flex; align-items:center; gap:0.5rem; background:var(--bg-darker); padding:0.4rem 0.8rem; border-radius:9999px; border:1px solid var(--border);">
          <div class="avatar" style="width:20px; height:20px;"></div>
          <span id="user-display-name" style="font-size:0.85rem; font-weight:600;">...</span>
        </div>
      </header>

      <div id="view-container" class="view-content">
        <!-- Content loaded by main.js -->
      </div>
    </main>

    <!-- Call Overlay (fullscreen modal for voice/video calls) -->
    <div id="call-overlay" class="call-overlay" style="display:none">
      <div class="call-overlay-inner">
        <div class="call-info">
          <div class="call-avatar"></div>
          <div id="call-peer-name" class="call-peer-name">Calling...</div>
          <div id="call-status" class="call-status">Connecting</div>
        </div>
        <div class="call-video-area" id="call-video-area" style="display:none">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
          <button class="call-btn call-btn-mute" id="btn-mute" title="Mute">🎤</button>
          <button class="call-btn call-btn-camera" id="btn-camera" title="Camera" style="display:none">📷</button>
          <button class="call-btn call-btn-hangup" id="btn-hangup" title="Hang Up">📞</button>
        </div>
      </div>
      <!-- Incoming Call Ring -->
      <div id="incoming-call-ring" class="incoming-call-ring" style="display:none">
        <div class="call-avatar" style="width:100px;height:100px"></div>
        <div id="incoming-caller" class="call-peer-name" style="margin-top:1rem">Incoming Call</div>
        <div class="call-status">Ringing...</div>
        <div style="display:flex;gap:2rem;margin-top:2rem">
          <button class="call-btn call-btn-accept" id="btn-accept">✅</button>
          <button class="call-btn call-btn-hangup" id="btn-reject">❌</button>
        </div>
      </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
      <div class="mobile-nav-item active" data-view="feed"><span>🏠</span></div>
      <div class="mobile-nav-item" data-view="explore"><span>🔍</span></div>
      <div class="mobile-nav-item" data-view="videos"><span>🎬</span></div>
      <div class="mobile-nav-item" data-view="rooms"><span>💬</span></div>
      <div class="mobile-nav-item" data-view="profile"><span>👤</span></div>
      <div class="mobile-nav-item" data-view="settings"><span>⚙️</span></div>
    </nav>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
